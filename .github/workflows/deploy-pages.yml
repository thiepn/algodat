name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    name: Vollständige Validierung
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node LTS einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Playwright Chromium installieren
        run: npx playwright install --with-deps chromium

      - name: Format prüfen
        run: npm run format:check

      - name: Vollständig verifizieren
        run: npm run verify

      - name: Dist-Artefakt prüfen
        run: test -f dist/index.html && test -f dist/404.html

      - name: Pages-Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: GitHub Pages deployen
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Pages deployen
        id: deployment
        uses: actions/deploy-pages@v4
